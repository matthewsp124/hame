<!DOCTYPE html>
{% load static %}
<html>
    <head lang="en">
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>
            HAME - {% block title %}Home{% endblock %}
        </title>
        <!-- Bootstrap's CSS-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <!-- custom CSS -->
        <link rel="stylesheet" href="{% static 'styles.css' %}" />
        {% block header %}
        {% endblock %}
    </head>

    <body class="d-flex flex-column min-vh-100">
        <!-- header -->
        <nav class="navbar sticky-top navbar-expand-lg mint-green-background border-bottom border-dark">
            <div class="container-fluid gap-3">
                <div class="navbar-header">
                    <a class="navbar-brand fs-2" href="{% url 'hame:index' %}">HAME</a>
                </div>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation bar">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <div class="navbar-nav gap-3">
                        <a href="{% url 'hame:index' %}" class="btn btn-lg btn-outline-dark px-4 {% if request.resolver_match.url_name == 'index' %}active{% endif %}">Home</a>
                        <a href="{% url 'hame:about' %}" class="btn btn-lg btn-outline-dark px-4 {% if request.resolver_match.url_name == 'about' %}active{% endif %}">About</a>
                    </div>
                    <ul class="navbar-nav ms-auto navbar-right align-items-center gap-3">
                        <li class="nav-item">
                            {% if user.is_authenticated %}
                                <div class="navbar-nav gap-3 align-items-center">
                                    <a href="{% url 'hame:logout' %}" class="btn btn-lg btn-outline-dark px-4" style="height: 48px;">Log Out</a>
                                    <a href="{% url 'hame:profile' %}" class="nav-link">
                                        <span class="rounded-circle light-blue-background d-inline-flex align-items-center justify-content-center" style="width: 50px; height: 50px;">
                                            <i class="bi bi-person-fill fs-1"></i>
                                        </span>
                                    </a>
                                </div>
                            {% else %}
                                <div class="navbar-nav gap-3">
                                    <a href="{% url 'hame:register' %}" class="btn btn-lg btn-outline-dark px-4">Register</a>
                                    <a href="{% url 'hame:login' %}" class="btn btn-lg btn-outline-dark px-4">Log In</a>
                                </div>
                            {% endif %}
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- <main class="flex-grow-1 d-flex flex-column"> -->
            {% block body %}
            {% endblock %}
        <!-- </main> -->
        <!-- Bootstrap's JavaScript -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
