<!DOCTYPE html>
{% load static %}
<html>
    <head lang="en">
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>
            HAME - {% block title %}Home{% endblock %}
        </title>
        <!-- Bootstrap's CSS & JavaScript -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <!-- custom CSS -->
         <link rel="stylesheet" href="{% static "styles.css" %}" />
    </head>

    <body>
        <!-- header -->
        <nav class="navbar fixed-top navbar-expand-lg light-green-background">
            <div class="container-fluid">
                <a class="navbar-brand" href="{% url 'hame:index' %}">HAME</a>
                <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation bar">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <div class="navbar-nav">
                        <a class="nav-item nav-link active" href="{% url 'hame:index' %}">Home <span class="sr-only">(current)</span></a>
                        <a class="nav-item nav-link active" href="{% url 'hame:about' %}">About</a>
                        <a class="nav-item nav-link active" href="#">Resources</a>
                        <a class="nav-item nav-link active" href="#">Site Settings</a>
                        <a class="nav-item nav-link active" href="#">My Account</a>
                    </div>
                </div>
            </div>
        </nav>

        <div>
            {% block body %}
            {% endblock %}
        </div>
    </body>
</html>
