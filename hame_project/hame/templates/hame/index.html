{% extends 'hame/base.html' %}
{% load static %}

{% block title %}
    Home
{% endblock %}

{% block header %}
    <link rel='stylesheet' href='https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css' />
    <script src='https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js'></script>
{% endblock %}

{% block body %}
<div id="map"></div>
<script>
    const map = new maplibregl.Map({
        style: 'https://tiles.openfreemap.org/styles/liberty',  // tile source
        center: [-3.1958, 55.9416],  // centre on Edinburgh by default
        zoom: 11.8,
        minZoom: 11.8,  // lock how far out the map can be zoomed to only the size of Edinburgh
        container: 'map',
        maxBounds: [  // lock the area visible on the map to just Edinburgh
            [-3.5, 55.855],  // west, south
            [-2.9, 56.0145]  // east, north
        ]
    })
</script>
{% endblock %}
