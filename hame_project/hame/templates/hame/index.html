{% extends 'hame/base.html' %}
{% load static %}

{% block title %}
    Home
{% endblock %}

{% block header %}
    <link rel='stylesheet' href='https://unpkg.com/maplibre-gl@6.0.0/dist/maplibre-gl.css' />
{% endblock %}

{% block body %}
<style>
    .map-page {
        position: relative;
        flex: 1;
        min-height: 0;
        display: flex;
    }

    #location-panel {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        height: 100%;
        max-width: 380px;
        z-index: 10; 
    }

    #map {
        flex: 1;
        min-height: 0;
        width: 100%;
    }

    #info {
        display: block;
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translate(-50%);
        width: 50%;
        padding: 10px;
        border: none;
        border-radius: 3px;
        font-size: 12px;
        text-align: center;
        color: #222;
        background: #fff;
    }
</style>

<div class="map-page">
    <div id="map"></div>

    <div class="offcanvas offcanvas-start" tabindex="-1" id="location-panel" data-bs-backdrop="false" aria-labelledby="location-panel-name" aria-hidden="true">
        <div class="offcanvas-header">
            <h2 class="offcanvas-title" id="location-panel-name">Location Name</h2>
                <!-- TODO: replace Location Name with the location's name -->
            <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>

        <div class="offcanvas-body">
            <!-- TODO: replace with actual details -->
            <p id="location-panel-address">Location Address</p>
            <p id="location-panel-categories">Location Categories</p>
        </div>    
    </div>

    <pre id="info"></pre>
</div>

<script type="module">
    import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.0.0/dist/maplibre-gl.mjs';

    const debug = true;

    // initialise the map
    const map = new maplibregl.Map({
        style: 'https://tiles.openfreemap.org/styles/bright',  // tile source
        center: [-3.1958, 55.9416],  // centre on Edinburgh by default
        zoom: 11.8,
        minZoom: 11.8,  // lock how far out the map can be zoomed to only the size of Edinburgh
        container: 'map',
        maxBounds: [  // lock the area visible on the map to just Edinburgh
            [-3.5, 55.855],  // west, south
            [-2.9, 56.0145]  // east, north
        ],
        maxPitch: 0,
    });


    map.on('load', async () => {
        const maskResponse = await fetch("{% static 'edinburghmask.geojson' %}?t=" + Date.now());  // force browser to get most recent geojson
        const maskGeojson = await maskResponse.json();

        // define the target area from .geojson file
        map.addSource('mask', {
            type: 'geojson',
            data: maskGeojson
        });

        // mask the outer area
        map.addLayer({
            id: 'mask-layer',
            type: 'fill',
            source: 'mask',
            paint: {
                'fill-color': '#888888',
                'fill-opacity': 0.6,
                'fill-outline-color': '#242424',
            }
        });
        
        // show navigation controls
        map.addControl(
            new maplibregl.NavigationControl({
                visualizeRoll: true,
                showZoom: true,
                shoCompass: true}),
            'bottom-right'
        );

        // geolocate the user
        // TODO: restrict so user is only located if within max bounds
        map.addControl(
            new maplibregl.GeolocateControl({
                positionOptions: {
                    enableHighAccuracy: true
                },
                trackUserLocation: true
            }),
            'bottom-right'
        );

        // get the locations from the database
        const locationResponse = await fetch("{% url 'hame:locations_geojson' %}");
        const locationGeojson = await locationResponse.json();

        map.addSource('locations', {
            type: 'geojson',
            data: locationGeojson,
            cluster: true,
            clusterMaxZoom: 16,  // stop clustering when zoomed in
            clusterRadius: 50,  // pixel radius of each cluster
        });

        // add clusters
        map.addLayer({
            id: 'clusters',
            type: 'circle',
            source: 'locations',
            filter: ['has', 'point_count'],
            paint: {
                'circle-color': [
                    'step', ['get', 'point_count'],
                    '#51bbd6', 100,  // blue circles when <= 100 points
                    '#f1f075', 750,  // yellow circles when 101 to 749 points
                    '#f28cb1'  // pink cicles when >= 750 points
            ],
                'circle-radius': [
                    'step', ['get', 'point_count'],
                    20, 100,  // blue circles are 20px
                    30, 750,  // yellow circles are 30px
                    40  // pink circles are 40px
                ]
            }
        });

        // display the number of points in each cluster
        map.addLayer({
            id: 'cluster-count',
            type: 'symbol',
            source: 'locations',
            filter: ['has', 'point_count'],
            layout: {
                'text-field': '{point_count_abbreviated}',
                'text-font': ['Noto Sans Regular'],
                'text-size': 12
            }
        });

        // add the individual points
        map.addLayer({
            id: 'unclustered-point',
            type: 'circle',
            source: 'locations',
            filter: ['!', ['has', 'point_count']],
            paint: {
                'circle-color': '#11b4da',
                'circle-radius': 4,
                'circle-stroke-width': 1,
                'circle-stroke-color': '#fff'
            }
        });

        // inspect a cluster on click
        map.on('click', 'clusters', async (e) => {
            const features = map.queryRenderedFeatures(e.point, {
                layers: ['clusters']
            });
            const clusterId = features[0].properties.cluster_id;
            const zoom = await map.getSource('locations').getClusterExpansionZoom(clusterId);
            map.easeTo({
                center: features[0].geometry.coordinates,
                zoom: zoom
            });
        });

        // show a popup when clicking on an individual point
        const locationPanel = new bootstrap.Offcanvas(document.getElementById('location-panel'));

        map.on('click', 'unclustered-point', (e) => {
            const feature = e.features[0];
            const properties = feature.properties;
            const coordinates = feature.geometry.coordinates.slice();

            document.getElementById('location-panel-name').textContent = properties.name || '';
            document.getElementById('location-panel-address').textContent = properties.address || '';
            document.getElementById('location-panel-categories').textContent = properties.categories || '';

            map.flyTo({ center: coordinates });
            const marker = new maplibregl.Marker().setLngLat(coordinates).addTo(map);
            locationPanel.show();
                
        });


        // change the cursor to a pointer when hovering over clickables
        for (const layer of ['clusters', 'unclustered-point']) {
            map.on('mouseenter', layer, () => { map.getCanvas().style.cursor = 'pointer'; });
            map.on('mouseleave', layer, () => { map.getCanvas().style.cursor = ''; });
        }

        // features for debugging
        if (debug) {
            // show mouse coordinates
            map.on('mousemove', (e) => {
                document.getElementById('info').innerHTML = 
                // e.point is (x, y) relative to top-left of map, e.lngLat is (lng, lat) in degrees
                `${JSON.stringify(e.point)}  
                <br />
                ${JSON.stringify(e.lngLat.wrap())}`;
            });
        }
        
    });
</script>
{% endblock %}
