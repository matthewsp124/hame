{% extends 'hame/base.html' %}
{% load static %}

{% block title %}
    Home
{% endblock %}

{% block header %}
    <link rel='stylesheet' href='https://unpkg.com/maplibre-gl@6.0.0/dist/maplibre-gl.css' />
{% endblock %}

{% block body %}
<style>
    .map-page {
        position: relative;
        flex: 1;
        min-height: 0;
        display: flex;
    }

    #map {
        flex: 1;
        min-height: 0;
        width: 100%;
    }

    #location-panel {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 380px;
        max-width: 88vw;
        z-index: 10; 
        display: flex;
        flex-direction: column;
        box-shadow: 3px 0 16px rgba(0, 0, 0, 0.2);
        transform: translateX(-100%);
        transition: transform 0.3s ease-in-out;
        visibility: hidden;
    }

    #location-panel.is-open {
        transform: translateX(0);
        visibility: visible;
    }

    #location-panel-header {
        flex: 0 0 auto;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
        padding: 18px 20px 14px;
        border-bottom: 1px solid rgba(0, 0, 0, 0.1);
    }
    
    #location-panel-name {
        margin: 0;
        font-size: 1.25rem;
        line-height: 1.2;
        word-break: break-word;
    }

    #location-panel-close {
        flex: 0 0 auto;
        border: none;
        background: transparent;
        font-size: 1.5rem;
        line-height: 1;
        cursor: pointer;
        padding: 4px 6px;
        border-radius: 4px;
        color: inherit;
    }

    #location-panel-close:hover,
    #location-panel-close:focus-visible {
        background-color: rgba(0, 0, 0, 0.1);
        outline: none;
    }

    #location-panel-body {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        padding: 16px 20px;
    }

    #location-panel-address,
    #location-panel-categories {
        margin: 0;
        font-weight: 600;
    }

    #accessibility-details:not(:empty),
    #reviews:not(:empty) {
        margin-top: 20px;
        padding-top: 16px;
        border-top: 1px solid rgba(0, 0, 0, 0.12);
    }

    @media (max-width: 768px) {
        #location-panel {
            width: 100%;
            max-width: 100vw;
        }
    }

    #debug-info {
        display: block;
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translate(-50%);
        width: 50%;
        padding: 10px;
        border: none;
        border-radius: 3px;
        font-size: 12px;
        text-align: center;
        color: #222;
        background: #fff;
    }
</style>

<div class="map-page">
    <div id="map"></div>

    <div class="light-green-background" id="location-panel" aria-labelledby="location-panel-name" aria-hidden="true">
        <div id="location-panel-header">
            <h2 id="location-panel-name">Location Name</h2>
            <button type="button" id="location-panel-close" aria-label="Close location details">&times;</button>
        </div>

        <div id="location-panel-body">
            <div id="location-details">
                <p id="location-panel-address">Location Address</p>
                <p id="location-panel-categories">Location Categories</p>
            </div>
            <div id="accessibility-details">

            </div>
            <div id="reviews">

            </div>
        </div>    
    </div>

    <pre id="debug-info"></pre>
</div>

<script type="module">
    import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.0.0/dist/maplibre-gl.mjs';

    const debug = true;
    let activeMarker = null;

    function clearActiveMarker() {
        if (activeMarker) {
            activeMarker.remove();
            activeMarker = null;
        }
    }

    // initialise the map
    const map = new maplibregl.Map({
        style: 'https://tiles.openfreemap.org/styles/bright',  // tile source
        center: [-3.1958, 55.9416],  // centre on Edinburgh by default
        zoom: 11.8,
        minZoom: 11.8,  // lock how far out the map can be zoomed to only the size of Edinburgh
        container: 'map',
        maxBounds: [  // lock the area visible on the map to just Edinburgh
            [-3.5, 55.855],  // west, south
            [-2.9, 56.0145]  // east, north
        ],
        maxPitch: 0,
    });


    map.on('load', async () => {
        const maskResponse = await fetch("{% static 'edinburghmask.geojson' %}?t=" + Date.now());  // force browser to get most recent geojson
        const maskGeojson = await maskResponse.json();

        // define the target area from .geojson file
        map.addSource('mask', {
            type: 'geojson',
            data: maskGeojson
        });

        // mask the outer area
        map.addLayer({
            id: 'mask-layer',
            type: 'fill',
            source: 'mask',
            paint: {
                'fill-color': '#888888',
                'fill-opacity': 0.6,
                'fill-outline-color': '#242424',
            }
        });
        
        // show navigation controls
        map.addControl(
            new maplibregl.NavigationControl({
                visualizeRoll: true,
                showZoom: true,
                shoCompass: true}),
            'bottom-right'
        );

        // geolocate the user
        // TODO: restrict so user is only located if within max bounds
        map.addControl(
            new maplibregl.GeolocateControl({
                positionOptions: {
                    enableHighAccuracy: true
                },
                trackUserLocation: true
            }),
            'bottom-right'
        );

        // get the locations from the database
        const locationResponse = await fetch("{% url 'hame:locations_geojson' %}");
        const locationGeojson = await locationResponse.json();

        map.addSource('locations', {
            type: 'geojson',
            data: locationGeojson,
            cluster: true,
            clusterMaxZoom: 16,  // stop clustering when zoomed in
            clusterRadius: 50,  // pixel radius of each cluster
        });

        // add clusters
        map.addLayer({
            id: 'clusters',
            type: 'circle',
            source: 'locations',
            filter: ['has', 'point_count'],
            paint: {
                'circle-color': [
                    'step', ['get', 'point_count'],
                    '#51bbd6', 100,  // blue circles when <= 100 points
                    '#f1f075', 750,  // yellow circles when 101 to 749 points
                    '#f28cb1'  // pink cicles when >= 750 points
            ],
                'circle-radius': [
                    'step', ['get', 'point_count'],
                    20, 100,  // blue circles are 20px
                    30, 750,  // yellow circles are 30px
                    40  // pink circles are 40px
                ]
            }
        });

        // display the number of points in each cluster
        map.addLayer({
            id: 'cluster-count',
            type: 'symbol',
            source: 'locations',
            filter: ['has', 'point_count'],
            layout: {
                'text-field': '{point_count_abbreviated}',
                'text-font': ['Noto Sans Regular'],
                'text-size': 12
            }
        });

        // add the individual points
        map.addLayer({
            id: 'unclustered-point',
            type: 'circle',
            source: 'locations',
            filter: ['!', ['has', 'point_count']],
            paint: {
                'circle-color': '#11b4da',
                'circle-radius': 4,
                'circle-stroke-width': 1,
                'circle-stroke-color': '#fff'
            }
        });

        // inspect a cluster on click
        map.on('click', 'clusters', async (e) => {
            const features = map.queryRenderedFeatures(e.point, {
                layers: ['clusters']
            });
            const clusterId = features[0].properties.cluster_id;
            const zoom = await map.getSource('locations').getClusterExpansionZoom(clusterId);
            map.easeTo({
                center: features[0].geometry.coordinates,
                zoom: zoom
            });
        });

        // clean the category names for display
        const categoryLabelOverrides = {
            "leisure|pitch": "Sports Pitch",
            "shop|do_it_yourself": "DIY Store",
            "highway|primary": "Main Road",
            "highway|secondary": "Road",
            "highway|tertiary": "Road",
            "highway|footway": "Footpath/Crossing",
            "amenity|taxi": "Taxi Rank",
        }

        function getCategoryLabel(key, value) {
            const override = categoryLabelOverrides[`${key}|${value}`];
            if (override) return override;
            return value
                // regex
                .replace(/_/g, ' ')  // replace all underscores with spaces
                .replace(/\w\S*/g, (word) => word.charAt(0).toUpperCase() + word.substr(1).toLowerCase());
                    // capitalise the first letter of each word
        }

        function formatCategories(categoryString) {
            if (!categoryString) return '';
            const [key, value] = categoryString.split('=');
            return getCategoryLabel(key?.trim() ?? '', value?.trim() ?? '');
                // if key, trim whitespace, else empty string - same for value
        }

        // show location info panel when clicking on an individual point
        const locationPanel = document.getElementById('location-panel');
        const locationPanelCloseButton = document.getElementById('location-panel-close');

        function openLocationPanel() {
            locationPanel.classList.add('is-open');
            locationPanel.setAttribute('aria-hidden', 'false');
        }

        function closeLocationPanel() {
            locationPanel.classList.remove('is-open');
            locationPanel.setAttribute('aria-hidden', 'true');
            clearActiveMarker();
        }

        // add event listeners to close the location panel
        locationPanelCloseButton.addEventListener('click', closeLocationPanel);
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && locationPanel.classList.contains('is-open')) {
                closeLocationPanel();
            }
        });

        map.on('click', 'unclustered-point', (e) => {
            const feature = e.features[0];
            const properties = feature.properties;
            const coordinates = feature.geometry.coordinates.slice();

            clearActiveMarker();

            document.getElementById('location-panel-name').textContent = properties.name || '';
            document.getElementById('location-panel-address').textContent = properties.address || '';
            document.getElementById('location-panel-categories').textContent = formatCategories(properties.categories);

            map.flyTo({ center: coordinates });
            activeMarker = new maplibregl.Marker().setLngLat(coordinates).addTo(map);
            openLocationPanel();
        });

        // change the cursor to a pointer when hovering over clickables
        for (const layer of ['clusters', 'unclustered-point']) {
            map.on('mouseenter', layer, () => { map.getCanvas().style.cursor = 'pointer'; });
            map.on('mouseleave', layer, () => { map.getCanvas().style.cursor = ''; });
        }

        // features for debugging
        if (debug) {
            // show mouse coordinates
            map.on('mousemove', (e) => {
                document.getElementById('debug-info').innerHTML = 
                // e.point is (x, y) relative to top-left of map, e.lngLat is (lng, lat) in degrees
                `${JSON.stringify(e.point)}  
                <br />
                ${JSON.stringify(e.lngLat.wrap())}`;
            });
        }
        
    });
</script>
{% endblock %}
